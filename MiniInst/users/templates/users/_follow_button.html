<div id="followActions">
  {% if blocked_between %}
    <button class="btn-follow-disabled" disabled>Дія недоступна</button>
  {% else %}
    {% if pending_request %}
      <form
        method="post"
        action="{% url 'users:follow_request_cancel' profile_user.username %}"
        hx-post="{% url 'users:follow_request_cancel' profile_user.username %}"
        hx-target="#followActions"
        hx-swap="outerHTML"
      >
        {% csrf_token %}
        <input type="hidden" name="render" value="button">
        <button type="submit" class="btn-unfollow">Скасувати запит</button>
      </form>
    {% else %}
      {% if is_following %}
        <form
          method="post"
          action="{% url 'users:unfollow_user' profile_user.username %}"
          hx-post="{% url 'users:unfollow_user' profile_user.username %}"
          hx-target="#followActions"
          hx-swap="outerHTML"
        >
          {% csrf_token %}
          <button type="submit" class="btn-unfollow">Відписатися</button>
        </form>
      {% else %}
        <form
          method="post"
          action="{% url 'users:follow_user' profile_user.username %}"
          hx-post="{% url 'users:follow_user' profile_user.username %}"
          hx-target="#followActions"
          hx-swap="outerHTML"
        >
          {% csrf_token %}
          <button type="submit" class="btn-follow">Підписатися</button>
        </form>
      {% endif %}
    {% endif %}
  {% endif %}
</div>
