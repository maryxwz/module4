<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Деталі поста</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-lg p-4" style="border-radius: 15px;">
        <h3 class="mb-3">{{ post.author.username }}</h3>
        <p class="text-muted">{{ post.created_at|date:"Y-m-d H:i" }}</p>

        {% if post.image %}
            <img src="{{ post.image.url }}" class="img-fluid rounded mb-3">
        {% endif %}

        <p>{{ post.caption }}</p>

        <div class="d-flex justify-content-between mt-3">
            <a href="{% url 'post_list' %}" class="btn btn-secondary">⬅ Назад</a>
            <div>
                <a href="{% url 'post_update' post.pk %}" class="btn btn-warning me-2">Редагувати</a>
                <a href="{% url 'post_archive' post.pk %}" class="btn btn-danger">Архівувати</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
