<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Всі пости</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Всі пости</h2>
        <a href="{% url 'post_create' %}" class="btn btn-success">➕ Додати пост</a>
    </div>

    {% if posts %}
        {% for post in posts %}
            <div class="card shadow-sm mb-4" style="border-radius: 15px;">
                <div class="card-body">
                    <h5 class="card-title">{{ post.author.username }}</h5>
                    <h6 class="card-subtitle mb-2 text-muted">{{ post.created_at|date:"Y-m-d H:i" }}</h6>

                    {% if post.image %}
                        <img src="{{ post.image.url }}" class="img-fluid rounded mb-3" style="max-height: 300px;">
                    {% endif %}

                    <p class="card-text">{{ post.caption }}</p>

                    <div class="d-flex justify-content-end">
                        <a href="{% url 'post_detail' post.pk %}" class="btn btn-outline-primary btn-sm me-2">Деталі</a>
                        <a href="{% url 'post_update' post.pk %}" class="btn btn-outline-warning btn-sm me-2">Редагувати</a>
                        <a href="{% url 'post_archive' post.pk %}" class="btn btn-outline-danger btn-sm">Архівувати</a>
                    </div>
                </div>
            </div>
        {% endfor %}
    {% else %}
        <p class="text-muted">Постів поки немає 👀</p>
    {% endif %}
</div>

</body>
</html>
