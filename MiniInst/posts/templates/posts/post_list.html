{% extends 'base.html' %}

{% block title %}Мої пости{% endblock %}

{% block content %}
{% load static %}

<style>
    .empty-state {
        max-width: 500px;
        margin: 60px auto;
        padding: 30px;
        background: #fff;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }

    .empty-state h2 {
        margin-bottom: 10px;
        color: #333;
    }

    .empty-state p {
        margin-bottom: 20px;
        color: #666;
    }

    .create-post-link {
        display: inline-block;
        padding: 12px 24px;
        background: #28a745;
        color: white;
        border-radius: 8px;
        text-decoration: none;
        transition: 0.3s;
        font-weight: bold;
        font-size: 16px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .create-post-link:hover {
        background: #218838;
        transform: translateY(-2px);
        box-shadow: 0 6px 14px rgba(0,0,0,0.2);
    }
</style>

<div class="empty-state">
    <p>Натисни кнопку нижче, щоб створити новий пост 🚀</p>
    <a href="{% url 'posts:post_create' %}" class="create-post-link">
        ➕ Створити новий пост
    </a>
</div>
{% endblock %}
