<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>
        {% if form.instance.pk %}
            Редагувати пост
        {% else %}
            Створити пост
        {% endif %}
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center mt-5">
    <div class="card shadow-lg p-4" style="width: 500px; border-radius: 15px;">
        <h2 class="text-center mb-4">
            {% if form.instance.pk %}
                Редагувати пост
            {% else %}
                Створити пост
            {% endif %}
        </h2>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Назва</label>
                {{ form.title }}
            </div>

            <div class="mb-3">
                <label class="form-label">Зображення</label>
                {{ form.image }}
            </div>

            <div class="mb-3">
                <label class="form-label">Опис</label>
                {{ form.caption }}
            </div>

            <div class="d-flex justify-content-between">
                <a href="{% url 'post_list' %}" class="btn btn-secondary">Скасувати</a>
                <button type="submit" class="btn btn-primary">
                    {% if form.instance.pk %}Зберегти{% else %}Створити{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
